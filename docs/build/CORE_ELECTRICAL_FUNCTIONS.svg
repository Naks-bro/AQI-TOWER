<text x="42" y="78" font-size="17">Electrical functions R00 · 3 October 2026</text>
<rect x="42" y="98" width="1036" height="44" rx="8" fill="#fff0cd"/>
<text x="59" y="126" font-size="17" font-weight="600">PRELIMINARY — NOT A WIRING DRAWING. No component ratings or terminals released.</text>
<g fill="white" stroke="#a8bdca" stroke-width="2">
