<rect x="42" y="486" width="1036" height="118" rx="12" fill="#e1edf2"/>
<text x="62" y="518" font-size="18" font-weight="700">Service access: STOP ≠ isolation ≠ safe access</text>
<text x="62" y="548" font-size="17">Lock off identified supplies, verify isolation and account for fan run-down before work.</text>
<text x="62" y="578" font-size="17">PE is never switched/fused. Monitoring has no safety-control authority. Ratings / terminals: UNKNOWN.</text>
<text x="42" y="636" font-size="15">Functional arrows only, not conductors. Fan selection, E01–E06 release and physical commissioning remain open.</text>
</g></svg>
