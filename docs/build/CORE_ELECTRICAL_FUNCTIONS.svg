<g font-size="17" text-anchor="middle">
<text x="137" y="223">Actual premises</text><text x="137" y="248">supply / UNKNOWN</text>
<text x="392" y="221">Reviewed protection</text><text x="392" y="248">+ lockable isolation</text>
<text x="667" y="221">Reviewed fan switching</text><text x="667" y="248">+ restart prevention</text>
<text x="952" y="221">Exact OEM fan</text><text x="952" y="248">+ compatible speed control</text>
<text x="182" y="392">Local START / STOP / RESET</text><text x="182" y="421">No remote start</text>
<text x="577" y="383">Independent protective functions</text><text x="577" y="409">Access / OEM protection / stop as assessed</text><text x="577" y="434">Architecture still requires qualified review</text>
<text x="952" y="392">Separate isolated monitoring</text><text x="952" y="421">Sensors → laptop → records</text>
